[package]
name = "wasmer/python-http-server"
version = "0.1.0"
description = "wasmer/python-http-server py worker"

[dependencies]
"wasmer/python" = "^3.13.20"

[fs]
"/src" = "./src"

[[command]]
name = "script"
module = "wasmer/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-m", "flask", "--app", "/src", "run"]
env = ["PYTHONEXECUTABLE=/bin/python"]
